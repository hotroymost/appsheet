<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý trung tâm tiếng Anh</title>
  <link href="./src/output.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .header {
      padding: 10px;
      background-color: #1f2937;
      color: #fff;
      text-align: center;
    }

    @media (max-width: 768px) {
      .header {
        font-size: 16px;
      }
    }
  </style>
</head>
<body class="bg-white text-gray-800">
  <div class="iframe-container">
    <iframe
      src="https://www.appsheet.com/start/479a0ecf-7028-418b-a050-89aab873c983"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
